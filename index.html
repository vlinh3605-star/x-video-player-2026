
<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Xem video</title>

  <!-- Twitter Player Card -->
  <meta name="twitter:card" content="player">
  <meta name="twitter:title" content="Xem video">
  <meta name="twitter:description" content="Video ngắn">

  <meta name="twitter:image"
    content="https://vlinh3605-star.github.io/x-video-player-2026/poster.jpg">

  <meta name="twitter:player"
    content="https://vlinh3605-star.github.io/x-video-player-2026/player.html">

  <meta name="twitter:player:width" content="720">
  <meta name="twitter:player:height" content="1280">

  <meta name="twitter:player:stream"
    content="https://vlinh3605-star.github.io/x-video-player-2026/video.mp4">

  <meta name="twitter:player:stream:content_type"
    content="video/mp4">

  <!-- Open Graph -->
  <meta property="og:type" content="video.other">
  <meta property="og:title" content="Xem video">
  <meta property="og:description" content="Video ngắn">

  <meta property="og:image"
    content="https://vlinh3605-star.github.io/x-video-player-2026/poster.jpg">

  <style>
    body {
      margin: 0;
      background: #101114;
      color: white;
      font: 16px system-ui;
      display: grid;
      min-height: 100vh;
      place-items: center;
    }

    .wrap {
      width: min(100%, 420px);
      padding: 16px;
      box-sizing: border-box;
    }

    video {
      width: 100%;
      border-radius: 12px;
      max-height: 80vh;
    }

    a {
      display: block;
      text-align: center;
      background: white;
      color: #111;
      text-decoration: none;
      border-radius: 8px;
      padding: 14px;
      margin-top: 12px;
    }
  </style>
</head>

<body>
  <main class="wrap">

    <video
      controls
      playsinline
      poster="./poster.jpg"
      src="./video.mp4">
    </video>

    <a href="https://osamanetwork.com/2024926"
       target="_blank"
       rel="noopener noreferrer">
      Mở website
    </a>

  </main>
</body>
</html>
